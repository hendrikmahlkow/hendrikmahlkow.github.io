project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"          # only the site pages; keeps CLAUDE.md/README.md off the website
  resources:           # copied into docs/ on every render (the render clears docs/)
    - files/**
    - images/**

website:
  title: "Hendrik Mahlkow"
  navbar:
    title: false # change this to false!
    left:
      - href: index.qmd
        text: Hendrik Mahlkow
      - about.qmd
      - coding.qmd
      - research.qmd
  search: false # no search bar!
  page-footer: 
    background: light
    left: 
    # add the current date to the footer
      - "Updated on July 25, 2024. © Hendrik Mahlkow 1989-2024."
    right: 
      - icon: github
        href: https://github.com/hendrikmahlkow
      - icon: twitter
        href: https://twitter.com/HMahlkow

format:
  html:
    # see: https://quarto.org/docs/output-formats/html-themes.html#customizing-themes
    theme: [litera, styles.scss] 
    mainfont: Jost
    css: styles.css

editor: visual

