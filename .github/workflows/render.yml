name: Render site and CV

# Renders the Quarto site into docs/ and compiles src/CV.tex, then commits the
# result back to main. GitHub Pages serves docs/, so nothing else is needed.
#
# NOTE: `quarto render` clears the output directory. Anything the site needs at
# runtime must therefore exist as a SOURCE folder in the repo root (files/,
# images/) so that Quarto copies it into docs/ on every render.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'          # don't re-run on the commit this workflow makes
      - 'README.*'
  workflow_dispatch:        # lets you trigger a render by hand from the Actions tab

permissions:
  contents: write           # needed to push the rendered output back

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile src/CV.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: src
          root_file: CV.tex

      - name: Update the downloadable CV
        run: cp src/CV.pdf files/CV.pdf

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # add "with: {version: 1.5.57}" to pin a specific Quarto version

      - name: Render website into docs/
        run: quarto render

      - name: Restore CNAME (custom domain) after the render
        run: git checkout -- docs/CNAME || true

      - name: Commit rendered output
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs files
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Render site and CV [skip ci]"
            git push
          fi
